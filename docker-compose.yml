services:
  spoilarr:
    build: .
    image: spoilarr:local
    container_name: spoilarr
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      # Externally reachable URL, used when registering the Plex webhook.
      SPOILARR_PUBLIC_URL: "http://spoilarr:8484"
      SPOILARR_LOG_LEVEL: "info"
    volumes:
      - ./data:/data
